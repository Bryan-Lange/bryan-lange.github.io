<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bryan Lange</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    .portal {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: flex 0.7s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .panel:hover { flex: 1.35; }
    .portal:has(.panel-wu:hover) .panel-pro { flex: 0.65; }
    .portal:has(.panel-pro:hover) .panel-wu { flex: 0.65; }

    /* ── WU PANEL ── */
    .panel-wu { background: #050a05; }

    #matrix-canvas {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      opacity: 0.5;
      z-index: 0;
    }

    .panel-wu .panel-content { z-index: 2; }

    /* ── PRO PANEL ── */
    .panel-pro { background: #0d1117; }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: 0;
    }

    .panel-pro .panel-content { z-index: 2; }

    /* ── SHARED CONTENT ── */
    .panel-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
      gap: 1.2rem;
      pointer-events: none;
    }

    /* ── WU CONTENT ── */
    .wu-logo {
      width: 90px; height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(200,151,26,0.6));
      transition: transform 0.4s ease, filter 0.4s ease;
      margin-bottom: 0.4rem;
    }

    .panel-wu:hover .wu-logo {
      transform: scale(1.08);
      filter: drop-shadow(0 0 32px rgba(25, 235, 182, 0.95));
    }

    .wu-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.0rem;
      letter-spacing: 0.35em;
      color: #00ff41;
      text-transform: uppercase;
    }

    .wu-title {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(2rem, 4vw, 3.5rem);
      letter-spacing: 0.18em;
      color: #c8971a;
      text-shadow: 0 0 40px rgba(200,151,26,0.5);
      line-height: 1;
    }

    .wu-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      color: #d0f0da;
      letter-spacing: 0.12em;
      line-height: 1.6;
      max-width: 220px;
    }

    .wu-btn {
      margin-top: 0.6rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c8971a;
      border: 1px solid #c8971a;
      padding: 0.75rem 2rem;
      border-radius: 15px;
      pointer-events: all;
      text-decoration: none;
      transition: background 0.2s, box-shadow 0.2s;
      display: inline-block;
    }

    .wu-btn:hover {
      background: rgba(200,151,26,0.12);
      box-shadow: 0 0 20px rgba(200,151,26,0.3);
    }

    /* ── PRO CONTENT ── */
    .pro-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      font-weight: 500;
      color: #3b82f6;
      transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
      margin-bottom: 0.4rem;
    }

    .panel-pro:hover .pro-avatar {
      transform: scale(1.08);
      border-color: rgba(59,130,246,0.6);
      box-shadow: 0 0 28px rgba(59,130,246,0.25);
    }

    .pro-label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: #3b82f6;
      text-transform: uppercase;
    }

    .pro-title {
      font-size: clamp(1.8rem, 3.5vw, 3rem);
      font-weight: 500;
      color: #e6edf3;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .pro-sub {
      font-size: 0.8rem;
      color: #7d8590;
      line-height: 1.7;
      max-width: 220px;
      font-weight: 300;
    }

    .pro-btn {
      margin-top: 0.6rem;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      color: #fff;
      background: #3b82f6;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 5px;
      pointer-events: all;
      text-decoration: none;
      transition: background 0.2s, box-shadow 0.2s;
      display: inline-block;
    }

    .pro-btn:hover {
      background: #2563eb;
      box-shadow: 0 0 24px rgba(59,130,246,0.35);
    }

    /* ── DIVIDER ── */
    .divider {
      position: absolute;
      left: 50%;
      top: 0; bottom: 0;
      transform: translateX(-50%);
      width: 1px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .divider-line-top {
      flex: 1;
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(180,180,180,0.2));
    }

    .divider-line-bot {
      flex: 1;
      width: 1px;
      background: linear-gradient(to top, transparent, rgba(180,180,180,0.2));
    }

    .divider-pill {
      background: linear-gradient(90deg,rgba(23, 171, 230, 1) 0%, rgba(250, 242, 12, 1) 50%, rgba(96, 237, 83, 1) 100%);
      border: 0.5px solid rgba(200,200,200,0.15);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      color: #000000;
      white-space: nowrap;
      text-transform: uppercase;
      animation: pillFade 1s 0.5s ease both;
    }

    @keyframes pillFade {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── ENTRY ANIMATIONS ── */
    .panel-wu  { animation: slideLeft  0.9s cubic-bezier(0.22,1,0.36,1) both; }
    .panel-pro { animation: slideRight 0.9s cubic-bezier(0.22,1,0.36,1) both; }

    @keyframes slideLeft  {
      from { opacity: 0; transform: translateX(-40px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideRight {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── EXIT OVERLAY ── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .overlay.active { pointer-events: all; opacity: 1; }
    .overlay-wu  { background: #050a05; }
    .overlay-pro { background: #0d1117; }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      .portal { flex-direction: column; }
      .panel:hover { flex: 1.25; }
      .portal:has(.panel-wu:hover) .panel-pro { flex: 0.75; }
      .portal:has(.panel-pro:hover) .panel-wu { flex: 0.75; }
      .divider {
        left: 0; right: 0; top: 50%; bottom: auto;
        width: 100%; height: 1px;
        transform: translateY(-50%);
        flex-direction: row;
      }
      .divider-line-top {
        height: 1px; width: auto; flex: 1;
        background: linear-gradient(to right, transparent, rgba(180,180,180,0.2));
      }
      .divider-line-bot {
        height: 1px; width: auto; flex: 1;
        background: linear-gradient(to left, transparent, rgba(180,180,180,0.2));
      }
    }
  </style>
</head>
<body>

  <div class="overlay overlay-wu" id="overlayWu"></div>
  <div class="overlay overlay-pro" id="overlayPro"></div>

  <div class="portal">

    <!-- WU-TANG PANEL -->
    <div class="panel panel-wu" onclick="navigate('wu.html', 'wu')">
      <canvas id="matrix-canvas"></canvas>
      <div class="panel-content">
        <img src="images/wu_matrix.png" alt="Wu-Tang Matrix" class="wu-logo" />
        <div class="wu-title">It Was All A</div>
        <div class="wu-label">D.R.E.A.M.</div>
        <div class="wu-sub">Data Rules Everything Around Me</div>
        <a class="wu-btn">Enter the Matrix &rarr;</a>
      </div>
    </div>

    <!-- CENTER DIVIDER -->
    <div class="divider">
      <div class="divider-line-top"></div>
      <div class="divider-pill">Choose Your Path</div>
      <div class="divider-line-bot"></div>
    </div>

    <!-- PROFESSIONAL PANEL -->
    <div class="panel panel-pro" onclick="navigate('pro.html', 'pro')">
      <div class="grid-bg"></div>
      <div class="panel-content">
        <div class="pro-avatar">BL</div>
        <div class="pro-label">Portfolio</div>
        <div class="pro-title">Bryan Lange</div>
        <div class="pro-sub">Data analyst &amp; engineer. Projects, stack, and contact.</div>
        <a class="pro-btn">View Portfolio &rarr;</a>
      </div>
    </div>

  </div>

  <script>
    // Matrix rain (left panel only)
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    let cols, drops;
    const chars = 'BRYAN';

    function initMatrix() {
      canvas.width = canvas.parentElement.offsetWidth;
      canvas.height = canvas.parentElement.offsetHeight;
      cols = Math.floor(canvas.width / 14);
      drops = Array(cols).fill(1);
    }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(5,10,5,0.07)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < drops.length; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        const b = Math.random();
        if (b > 0.95)     { ctx.fillStyle = '#fff'; ctx.shadowColor = '#00ff41'; ctx.shadowBlur = 10; }
        else if (b > 0.7) { ctx.fillStyle = '#00ff41'; ctx.shadowColor = '#00ff41'; ctx.shadowBlur = 4; }
        else              { ctx.fillStyle = '#006620'; ctx.shadowBlur = 0; }
        ctx.font = '14px "Share Tech Mono", monospace';
        ctx.fillText(char, i * 14, drops[i] * 14);
        if (drops[i] * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }

    initMatrix();
    setInterval(drawMatrix, 40);
    window.addEventListener('resize', initMatrix);

    function navigate(url, side) {
      const overlay = document.getElementById(side === 'wu' ? 'overlayWu' : 'overlayPro');
      overlay.classList.add('active');
      setTimeout(() => { window.location.href = url; }, 500);
    }
  </script>
</body>
</html>
